aid: coravin
name: Coravin
description: >-
  Coravin is a consumer beverage-technology company best known for its wine
  preservation systems, which use a thin needle and inert argon gas to pour wine
  by the glass without pulling the cork, leaving the remaining wine unoxidized
  for weeks or months. Its product line spans the Timeless, Pivot, and Sparkling
  systems plus Pure argon capsules, sold direct-to-consumer and through retail
  and trade channels. Coravin does not operate a standalone public developer
  API; its direct storefront runs on Shopify, which exposes a real agent-native
  commerce surface — a Universal Commerce Protocol (UCP) merchant profile, a
  hosted shopping MCP endpoint, and OIDC / OAuth 2.0 authorization-server
  metadata for Shopify Customer Accounts. Backed by Battery Ventures.
