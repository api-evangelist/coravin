generated: '2026-07-18'
method: searched
status: published
source: https://www.coravin.com/.well-known/ucp
notes: >-
  Coravin's Shopify storefront publishes a live Universal Commerce Protocol
  (UCP) shopping MCP server. tools/list requires a UCP agent-profile handshake
  (the anonymous call returns error -32001 invalid_profile_url), so tool names
  are not enumerated here; the capabilities below are taken verbatim from the
  published /.well-known/ucp merchant profile. Not a bespoke Coravin server —
  it is the Shopify UCP agentic-commerce endpoint for this merchant.
server:
  name: coravin-ucp-shopping
  transport: http
  protocol: mcp
  url: https://www.coravin.com/api/ucp/mcp
  ucp_version: '2026-04-08'
  supported_versions:
    - '2026-04-08'
    - '2026-01-23'
  spec: https://ucp.dev/2026-04-08/specification/overview/
  schema: https://ucp.dev/2026-04-08/services/shopping/mcp.openrpc.json
capabilities:
  - id: dev.ucp.shopping.catalog.search
    spec: https://ucp.dev/2026-04-08/specification/catalog
  - id: dev.ucp.shopping.catalog.lookup
    spec: https://ucp.dev/2026-04-08/specification/catalog
  - id: dev.ucp.shopping.cart
    spec: https://ucp.dev/2026-04-08/specification/cart
  - id: dev.ucp.shopping.checkout
    spec: https://ucp.dev/2026-04-08/specification/checkout
  - id: dev.ucp.shopping.discount
    spec: https://ucp.dev/2026-04-08/specification/discount
  - id: dev.ucp.shopping.fulfillment
    spec: https://ucp.dev/2026-04-08/specification/fulfillment
  - id: dev.ucp.shopping.order
    spec: https://ucp.dev/2026-04-08/specs/shopping/order
  - id: dev.shopify.catalog
    spec: https://shopify.dev/docs/agents/catalog/storefront-catalog
payment_handlers:
  - com.google.pay
  - dev.shopify.card
  - dev.shopify.shop_pay
